name: Publish to Notchlog
on:
  push:
    branches: [ main ]
jobs:
  publish-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Send Post to Notchlog
        env:
          NOTCHLOG_API_KEY: ${{ secrets.NOTCHLOG_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TITLE=$(echo "$COMMIT_MSG" | head -1)
          CONTENT=$(echo "$COMMIT_MSG" | tail -n +3)
          
          if [ -z "$CONTENT" ]; then
            CONTENT="Deploy ${COMMIT_SHA:0:7}"
          fi
          
          PAYLOAD=$(jq -n \
            --arg slug "notchlog" \
            --arg title "$TITLE" \
            --arg content "$CONTENT" \
            --arg tag "feature" \
            '{project_slug: $slug, title: $title, content: $content, tag: $tag, published: true}')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://ptyclwpofzwrfrcwdnfb.supabase.co/functions/v1/api-v1/changelog \
            -H "Authorization: Bearer $NOTCHLOG_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "ERRO: API retornou $HTTP_CODE"
            exit 1
          fi
